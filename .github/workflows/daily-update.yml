name: daily-update

permissions: {}

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 北京时间 08:00（GitHub 队列可能延迟数小时）
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write   # 回写 index.html / 报告 / feed
      issues: write     # 失败时开告警 issue
    steps:
      # 固定到 v4.2.2 提交，避免 tag 被移动的供应链风险
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run page diff monitor (13 official pages)
        shell: pwsh
        run: monitor/run-monitor.ps1 -WsRoot $env:GITHUB_WORKSPACE

      - name: Run Tavily discovery (optional, needs TAVILY_KEY secret)
        shell: pwsh
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: monitor/tavily-search.ps1 -WsRoot $env:GITHUB_WORKSPACE

      - name: Run Bocha weekly search (optional, needs BOCHA_KEY secret)
        shell: pwsh
        env:
          BOCHA_KEY: ${{ secrets.BOCHA_KEY }}
        run: monitor/bocha-search.ps1 -WsRoot $env:GITHUB_WORKSPACE

      - name: Sync AIHOT (free-tokens merge + daily news)
        shell: pwsh
        run: node monitor/aihot-fetch.js

      - name: Rebuild app HTML from template + logos
        shell: pwsh
        run: |
          $t = [IO.File]::ReadAllText('app_template.html')
          $j = [IO.File]::ReadAllText('logos.json')
          $t = $t.Replace('/*__LOGOS__*/{}', $j)
          [IO.File]::WriteAllText('大模型免费渠道全景表.html', $t, (New-Object Text.UTF8Encoding($false)))
          Copy-Item '大模型免费渠道全景表.html' 'index.html' -Force

      - name: Validate build (syntax, required fields, dates, dual-file parity)
        shell: pwsh
        run: node monitor/validate-build.js

      - name: Rebuild derived assets (feed.xml + CSV from DATA)
        shell: pwsh
        run: node monitor/build-assets.js

      - name: Commit patrol results
        shell: pwsh
        run: |
          git config user.name 'freellm-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app_template.html monitor/reports monitor/changes.xml feed.xml monitor/feed.xml index.html '大模型免费渠道全景表.html' '免费渠道种子表.csv'
          if (git diff --cached --quiet) { Write-Host 'no changes'; exit 0 }
          git commit -m 'daily patrol: refresh data, reports and feed'
          git push

      - name: Open alert issue on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $open = gh issue list --state open --search 'daily patrol failed in:title' --json number --jq 'length'
          if ($open -ne '0') { Write-Host '已有未关闭的巡查告警，跳过重复创建'; exit 0 }
          gh issue create --title "daily patrol failed $(Get-Date -Format yyyy-MM-dd)" --body "运行日志：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
